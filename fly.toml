# Fly.io: one app, two process groups (OPS-0001).
#   api — uvicorn, public, on the pooled DSN
#   sim — the daemon, no ingress, on the direct DSN (its writer lock is a
#         session-level advisory lock; a transaction pooler would lose it)
#
# Deploy with: fly deploy            (both groups, one image, one release)
# Secrets:     fly secrets set OPENROUTER_API_KEY=... JEVE_DATABASE_URL=... \
#                JEVE_DATABASE_POOLED_URL=...
# Database region: us-east-1 (closest Fly region: iad).

app = "jeve-backend"
primary_region = "iad"  # Washington D.C. — closest to us-east-1

[build]
  # One image serves both groups: api and sim are the same distribution with
  # different commands. Dockerfile.sim exists for docker-compose, where the
  # two services build apart.
  dockerfile = "infra/docker/Dockerfile.api"

# Migrations run in a release machine before the new version takes traffic.
# The machine gets the app's secrets, so JEVE_DATABASE_URL is the direct DSN —
# migration must never go through the transaction pooler.
[deploy]
  release_command = "python -c 'from jeve import db; print(db.migrate())'"

[env]
  PYTHONPATH = "/app/src"
  # API-only reads, harmless on sim.
  JEVE_CORS_ORIGINS = "https://jeve.punitarani.com"
  # GEN-0001/OPS-0001: the site is read-only in production; nobody may spend
  # through the public API. Cached prose still serves.
  JEVE_DIALOGUE_GENERATE = "off"
  # LLM-0007: local ceilings are observability, not the stop — OpenRouter's
  # own cap is. The run cap is off and the ladder sits far above any real
  # run (~$120/day worst case at the governor's $2/window), so it watches
  # rather than halts: crossing $10k means something else broke entirely.
  JEVE_RUN_CAP_USD = "0"
  JEVE_EXPLORE_CEILING_USD = "10000"
  JEVE_HALT_CEILING_USD = "10000"
  JEVE_HARD_CEILING_USD = "10000"
  JEVE_CASSETTE = "off"

[processes]
  api = "uvicorn jeve.api.app:app --host 0.0.0.0 --port 8000"
  # The entrypoint maps deliberate halts (exits 4-7) to 0, and Fly's default
  # on-fail policy restarts only non-zero exits — so a crash comes back and a
  # halt stays down. Explicit args: record mode, not the replay default.
  sim = "sh /app/sim-entrypoint.sh --policy jev --calls record --cassette off"

# Public ingress exists only for api. The sim group has no [[services]]
# section, so no proxy will ever route to it.
[[services]]
  internal_port = 8000
  processes = ["api"]
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 250
    soft_limit = 200
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api", "sim"]
