# Static export hosting (WEB-0005). Next emits out/index.html and
# out/world/index.html; anything else is a client-side route that belongs
# to index.html.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The export's hashed assets are immutable; everything else is revalidated.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
}
