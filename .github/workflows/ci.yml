name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI may reach a model. The gateway needs a key to construct a
  # live client, and its absence is the belt to the ruff rule's braces.
  CI: "true"

jobs:
  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate records and the supersede graph
        run: python3 scripts/gen-decisions.py --check

      - name: Generator unit tests
        run: python3 scripts/test_gen_decisions.py

      - name: Regenerate and fail if the tree is dirty
        run: |
          python3 scripts/gen-decisions.py
          if ! git diff --exit-code; then
            echo "::error::Generated artifacts are out of date."
            echo "Run: python3 scripts/gen-decisions.py"
            exit 1
          fi

      - name: markdownlint
        run: npx --yes markdownlint-cli2

  python:
    runs-on: ubuntu-latest
    # Without a database about half the suite skips: everything that runs the
    # world. It passed green for two sessions while testing none of it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jeve
          POSTGRES_PASSWORD: jeve
          POSTGRES_DB: jeve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeve -d jeve"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      JEVE_DATABASE_URL: postgresql://jeve:jeve@127.0.0.1:5432/jeve
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -ra

      - name: The world's tests ran, not skipped
        # A service that failed to start would turn the job green again by
        # skipping. Fail instead.
        run: |
          uv run python - <<'PY'
          from jeve import db
          with db.connect() as conn:
              print("postgres:", conn.execute("SHOW server_version").fetchone())
          PY

      - name: No second path to a model
        # LLM-0004. The ruff rule bans the import; this catches a raw URL in
        # any language, including the webapp.
        working-directory: .
        run: |
          # `config.py` names the base URL as a default the gateway reads. It
          # is configuration, not a caller: nothing there opens a connection.
          if git grep -nE 'openrouter\.ai/api' -- \
               ':!py/src/jeve/llm/**' ':!py/src/jeve/config.py' \
               ':!decisions/**' ':!docs/**' \
               ':!.github/**' ':!ops/**' ':!*.md'; then
            echo "::error::Only jeve.llm may address OpenRouter (LLM-0004)."
            exit 1
          fi

      - name: No credentials in the tree
        working-directory: .
        run: |
          if git grep -nE 'sk-or-v1-[A-Za-z0-9]' -- ':!*.md'; then
            echo "::error::An API key is committed. Rotate it."
            exit 1
          fi

  confirmations:
    # A `confirmation` that nobody runs is a comment. This is what stops them
    # becoming aspirational. Its own job because the commands need uv, pnpm and
    # a database, and the `decisions` job deliberately has none of them.
    #
    # These are arbitrary shell commands read out of files in the repo, so they
    # are only executed for branches pushed here — never for a pull request
    # from a fork, where the command would be attacker-controlled.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Without a database about half the suite skips: everything that runs the
    # world. It passed green for two sessions while testing none of it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jeve
          POSTGRES_PASSWORD: jeve
          POSTGRES_DB: jeve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeve -d jeve"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      JEVE_DATABASE_URL: postgresql://jeve:jeve@127.0.0.1:5432/jeve
    steps:
      - uses: actions/checkout@v5
      # Some confirmations call `python3` directly, and the decision-record
      # tooling needs 3.13+ (`Path.full_match`); the runner's own is older.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen --directory py
      - run: pnpm install --frozen-lockfile
      - name: Run each record's confirmation command, once each
        run: |
          set -o pipefail
          python3 - <<'PY' > /tmp/confirmations.tsv
          import json
          seen = {}
          for line in open("decisions/index.jsonl"):
              record = json.loads(line)
              command = record.get("confirmation")
              if command:
                  seen.setdefault(command, []).append(record["id"])
          for command, ids in seen.items():
              print(",".join(ids) + "\t" + command)
          PY
          status=0
          while IFS=$'\t' read -r ids cmd; do
            echo "::group::$ids: $cmd"
            if ! bash -c "$cmd"; then
              echo "::error::$ids confirmation failed: $cmd"
              status=1
            fi
            echo "::endgroup::"
          done < /tmp/confirmations.tsv
          exit $status

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing else compiles the TypeScript against the real page tree: the
      # dev server type-strips, and a contract change that breaks a component
      # would otherwise surface only in a browser.
      - run: pnpm --filter @jeve/web exec tsc --noEmit
