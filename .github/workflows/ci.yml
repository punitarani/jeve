name: ci

on:
  # One run per change. `push` on every branch plus an unfiltered
  # `pull_request` ran the whole workflow twice on the same commit (OPS-0002).
  # A branch with no pull request open is built with `workflow_dispatch`.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch runs are worth nothing; a superseded run on `main` is
  # a `flyctl deploy` or a `wrangler deploy` half-way through. Queue those.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deploy credentials come from Doppler at deploy time, so nothing here needs
# to write to the repository.
permissions:
  contents: read

env:
  # Nothing in CI may reach a model. The gateway needs a key to construct a
  # live client, and its absence is the belt to the ruff rule's braces.
  CI: "true"

jobs:
  changes:
    # The Python suite cannot observe a change to the web app or to prose, so
    # a pull request made only of those skips five minutes of it (OPS-0002).
    # Biased towards running: anything unrecognised is a reason to run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On a pull request the checkout is the merge commit, so its first
          # parent is the base: the diff is exactly this branch's change set,
          # with no API call and no extra token scope. A shallow fetch that
          # did not reach the parent tells us nothing, so it runs everything.
          if ! git rev-parse --verify --quiet HEAD^1 >/dev/null; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "no base commit in this checkout — running everything"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          echo "changed:"; sed 's/^/  /' changed.txt
          needed="$(scripts/ci-needs-python.sh < changed.txt)"
          echo "python=$needed" >> "$GITHUB_OUTPUT"
          echo "needs the python job: $needed"

  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate records and the supersede graph
        run: python3 scripts/gen-decisions.py --check

      - name: Generator unit tests
        run: python3 scripts/test_gen_decisions.py

      - name: Confirmation runner unit tests
        # OPS-0002. Every command these run is a shell builtin, which is why
        # they belong in the job with no uv, no pnpm and no database.
        run: python3 scripts/test_run_confirmations.py

      - name: Regenerate and fail if the tree is dirty
        run: |
          python3 scripts/gen-decisions.py
          if ! git diff --exit-code; then
            echo "::error::Generated artifacts are out of date."
            echo "Run: python3 scripts/gen-decisions.py"
            exit 1
          fi

      - name: markdownlint
        run: npx --yes markdownlint-cli2

  python:
    runs-on: ubuntu-latest
    # This job runs the suite twice: once here under xdist, and once again
    # single-process inside WEB-0006's confirmation, which shells out to
    # `make check`. Episodes (WORLD-0006) added a couple of minutes to each,
    # and the run that carried them finished in 23m12s against the old cap of
    # 25 — under two minutes of margin, so the next slow test anyone adds goes
    # red for reasons that have nothing to do with their change. Raised rather
    # than trimmed: the second run is the thing worth removing, and that means
    # revisiting OPS-0002's bargain with WEB-0006, not deleting coverage.
    timeout-minutes: 35
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    # Without a database about half the suite skips: everything that runs the
    # world. It passed green for two sessions while testing none of it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jeve
          POSTGRES_PASSWORD: jeve
          POSTGRES_DB: jeve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeve -d jeve"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      JEVE_DATABASE_URL: postgresql://jeve:jeve@127.0.0.1:5432/jeve
    steps:
      - uses: actions/checkout@v5
      # The confirmations include commands that call `python3` directly, and
      # the decision-record tooling needs 3.13+ (`Path.full_match`); the
      # runner's own is older.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `npx nx` resolves the local install — without node_modules it would
      # fetch whatever nx is latest that minute, not the lockfile's 23.2.1.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Python project lives in py/ — there is no root pyproject.toml, so a
      # bare `uv sync` fails before any check runs.
      - run: uv sync --frozen --directory py
      - run: npx nx run py:lint
      - run: npx nx run py:typecheck

      # One run of the suite, in parallel, each worker on a database of its
      # own (OPS-0002). `loadfile` keeps a module's tests together, which the
      # module-scoped world fixtures need. The api/sim nx targets are subsets
      # of this run and of py:lint/py:typecheck, so they are not run again.
      - name: Run the suite
        run: uv run --directory py pytest -n auto --dist loadfile --durations=15

      - name: The world's tests ran, not skipped
        # A service that failed to start would turn the job green again by
        # skipping. Fail instead. The workers test on `jeve_gwN`, not on
        # `jeve`, so this asks those for the world they should have built.
        run: |
          uv run --directory py python - <<'PY'
          from jeve import db

          with db.connect() as conn:
              print("postgres:", conn.execute("SHOW server_version").fetchone())
              workers = conn.execute(
                  "SELECT datname FROM pg_database WHERE datname LIKE 'jeve\\_gw%' "
                  "ORDER BY datname"
              ).fetchall()
          names = [row["datname"] for row in workers]
          print("worker databases:", names or "none")
          assert names, "no xdist worker database — the suite did not run in parallel"
          import os

          os.environ["JEVE_DATABASE_URL"] = db.dsn().rsplit("/", 1)[0] + "/" + names[0]
          with db.connect() as conn:
              built = conn.execute("SELECT to_regclass('events') AS t").fetchone()
          assert built is not None and built["t"], f"{names[0]} holds no world"
          print(f"{names[0]}: migrated and seeded")
          PY

      - name: No second path to a model
        # LLM-0004. The ruff rule bans the import; this catches a raw URL in
        # any language, including the webapp.
        working-directory: .
        run: |
          # `config.py` names the base URL as a default the gateway reads. It
          # is configuration, not a caller: nothing there opens a connection.
          # `.env.*.example` files document the same default for operators.
          if git grep -nE 'openrouter\.ai/api' -- \
               ':!py/src/jeve/llm/**' ':!py/src/jeve/config.py' \
               ':!decisions/**' ':!docs/**' \
               ':!.github/**' ':!ops/**' ':!*.md' ':!.env*'; then
            echo "::error::Only jeve.llm may address OpenRouter (LLM-0004)."
            exit 1
          fi

      - name: No credentials in the tree
        working-directory: .
        run: |
          if git grep -nE 'sk-or-v1-[A-Za-z0-9]' -- ':!*.md'; then
            echo "::error::An API key is committed. Rotate it."
            exit 1
          fi

      - name: Run each record's confirmation command, once each
        # A `confirmation` that nobody runs is a comment. This is what stops
        # them becoming aspirational (CORE-0001). Pytest confirmations are
        # collected rather than re-executed: the run above is the execution
        # (OPS-0002). Everything else runs verbatim.
        #
        # These are arbitrary shell commands read out of files in the repo, so
        # they are only executed for branches pushed here — never for a pull
        # request from a fork, where the command would be attacker-controlled.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: python3 scripts/run-confirmations.py --pytest collect

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen --directory py
      - run: pnpm install --frozen-lockfile
      - run: npx nx run contracts:typecheck
      - name: Check contract drift
        run: npx nx run contracts:check-drift

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --excludeTaskDependencies: typecheck and build otherwise pull in
      # contracts:generate, which is `uv run` — a whole Python toolchain for
      # what is a TypeScript gate. The committed generated file is what these
      # compile against, and the `contracts` job is what proves it is current.
      # No eslint config exists in the repo — tsc strict is the static gate.
      - run: npx nx run web:typecheck --excludeTaskDependencies
      - run: npx nx run web:build --excludeTaskDependencies
      - run: npx nx run web:test --excludeTaskDependencies

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t jeve-api-test .
      - name: Build Sim image
        run: docker build -f infra/docker/Dockerfile.sim -t jeve-sim-test .
      - name: Build Web image
        run: docker build -f infra/docker/Dockerfile.web -t jeve-web-test .

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # After the backend, never beside it (OPS-0003). The zod schema is compiled
    # into the static export at build time (WEB-0005), so a browser validates
    # `/state` against whatever the contract said when the web app was built.
    # Contracts flow backend to web (CORE-0011), so a new required field exists
    # in the API first and the page learns to expect it second. Shipping the
    # page first put a frontend that demanded `health.tracing` in front of an
    # API that did not send it yet, for up to nineteen minutes.
    #
    # `deploy-backend` needs [python, docker], so this waits on the suite too.
    needs: [web, contracts, deploy-backend]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NEXT_PUBLIC_* is inlined at build time — wrangler vars are not (the
      # site is a static export, WEB-0005).
      - env:
          NEXT_PUBLIC_JEVE_API: ${{ vars.NEXT_PUBLIC_JEVE_API }}
        run: pnpm --filter @jeve/web build
      # The only secret in this repo is DOPPLER_TOKEN: a read-only service
      # token scoped to infra/ci, which holds just the deploy credentials and
      # the one token that reads worker/prd (OPS-0004) — rotating a token in
      # Doppler is the whole rotation.
      - uses: dopplerhq/cli-action@v4
      - name: Fetch deploy credentials from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v="$(doppler secrets get "$s" -p infra -c ci --plain)"
            echo "::add-mask::$v"
            echo "$s=$v" >> "$GITHUB_ENV"
          done
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

  deploy-backend:
    # A dispatch on main deploys too, so a secret rotated in Doppler ships from
    # "Run workflow" with no commit to carry it (OPS-0004). deploy-web stays
    # push-only: a dispatch changes nothing it builds.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Twenty for the deploy, and up to seven more waiting on /state and on
    # Braintrust afterwards.
    timeout-minutes: 30
    # `api` and `sim` are nx targets inside the python job, not job ids —
    # depending on them by name made this job never runnable. The python job
    # now also carries the record confirmations (OPS-0002), so a red
    # confirmation holds the deploy.
    needs: [python, docker]
    steps:
      - uses: actions/checkout@v5
      - run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - uses: dopplerhq/cli-action@v4
      - name: Fetch deploy credentials from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          v="$(doppler secrets get FLY_API_TOKEN -p infra -c ci --plain)"
          echo "::add-mask::$v"
          echo "FLY_API_TOKEN=$v" >> "$GITHUB_ENV"
      # OPS-0004: flyctl deploy sets no secrets, and DOPPLER_TOKEN cannot read
      # worker/prd, so the Braintrust keys never reached a machine. Staged
      # here, they ship with the deploy below in its one restart. A missing
      # grant is an error annotation, not a failure: the code still ships, and
      # the gate after the deploy turns the run red.
      - name: Stage worker secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          echo "DEPLOY_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          scripts/stage-worker-secrets.sh
      # One deploy ships every process group in fly.toml (api and sim) from
      # one image; the release_command in fly.toml runs migrations first.
      - name: Deploy api+sim to Fly.io
        # --ha=false: the default creates a spare machine per group — 2 api +
        # 2 sim for a workload that is one public reader and one writer
        # pinned singleton by its advisory lock.
        run: flyctl deploy --config fly.toml --ha=false
      # Fails the run if the running app has no key; only warns if no span
      # has reached Braintrust within five minutes (OPS-0004).
      - name: Verify tracing
        env:
          JEVE_API: ${{ vars.NEXT_PUBLIC_JEVE_API }}
        run: scripts/verify-tracing.sh
