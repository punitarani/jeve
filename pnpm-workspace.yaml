packages:
  - apps/*
  - packages/*

# Build scripts run on install; ruling on each is how a fresh clone installs
# without an interactive approval prompt that would hang unattended. pnpm 11+
# reads `allowBuilds` — the old `onlyBuiltDependencies` list is dead config.
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  nx: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.75.1'
  - '@sentry/browser@10.75.1'
  - '@sentry/core@10.75.1'
  - '@sentry/feedback@10.75.1'
  - '@sentry/nextjs@10.75.1'
  - '@sentry/node-core@10.75.1'
  - '@sentry/node@10.75.1'
  - '@sentry/opentelemetry@10.75.1'
  - '@sentry/react@10.75.1'
  - '@sentry/replay-canvas@10.75.1'
  - '@sentry/replay@10.75.1'
  - '@sentry/server-utils@10.75.1'
  - '@sentry/vercel-edge@10.75.1'
