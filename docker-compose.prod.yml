# Self-hosted production stack: Postgres, the API, the daemon, the static site.
# For the hosted deployment (Fly + Cloudflare + Doppler) see docs/deployment.md.
#
# NEXT_PUBLIC_JEVE_API is the API origin *as the browser sees it* — it is
# inlined into the bundle at build time, so compose passes it as a build arg.
# Credentials interpolate from the environment with dev-safe defaults; set
# POSTGRES_PASSWORD / OPENROUTER_API_KEY / JEVE_DATABASE_URL for real use.

name: jeve-prod

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Browser-side URL: the container's own hostname means nothing to a
        # visitor's browser. Published port 8000 on the host is the default.
        NEXT_PUBLIC_JEVE_API: ${NEXT_PUBLIC_JEVE_API:-http://127.0.0.1:8000}
    ports:
      - "3000:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - JEVE_DATABASE_URL=postgresql://jeve:${POSTGRES_PASSWORD:-jeve}@postgres:5432/jeve
      - JEVE_CORS_ORIGINS=${JEVE_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # The dialogue endpoint can spend; self-hosters may want it on.
      - JEVE_DIALOGUE_GENERATE=${JEVE_DIALOGUE_GENERATE:-on}
      - PYTHONPATH=/app/src
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # /health only probes connectivity, so without this the API reports
      # healthy while every real endpoint 500s on a missing schema.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sim:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.sim
    environment:
      - JEVE_DATABASE_URL=postgresql://jeve:${POSTGRES_PASSWORD:-jeve}@postgres:5432/jeve
      - JEVE_POLICY=jev
      - JEVE_CALLS=record
      # The cache is the model_calls table; a cassette in a container is an
      # unbounded file on an ephemeral disk (LLM-0007).
      - JEVE_CASSETTE=off
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Guardrails, not the stop — OpenRouter's own cap is. Zero disables the
      # per-process cap, and the lifetime ladder sits far above any real run:
      # the dev defaults ($12/$16/$20) would halt the daemon for good at $16
      # of cumulative spend (LLM-0007).
      - JEVE_RUN_CAP_USD=${JEVE_RUN_CAP_USD:-0}
      - JEVE_EXPLORE_CEILING_USD=${JEVE_EXPLORE_CEILING_USD:-10000}
      - JEVE_HALT_CEILING_USD=${JEVE_HALT_CEILING_USD:-10000}
      - JEVE_HARD_CEILING_USD=${JEVE_HARD_CEILING_USD:-10000}
      # LLM-0008: unset key means tracing is simply off, which is the default
      # here — the daemon behaves exactly as it did before either way.
      - BRAINTRUST_API_KEY=${BRAINTRUST_API_KEY:-}
      - BRAINTRUST_PROJECT_ID=${BRAINTRUST_PROJECT_ID:-}
      - PYTHONPATH=/app/src
    # Deliberate halts arrive as exit 0 through the entrypoint, so on-failure
    # restarts crashes only — never a world that asked to stop.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python -m jeve.sim"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      - JEVE_DATABASE_URL=postgresql://jeve:${POSTGRES_PASSWORD:-jeve}@postgres:5432/jeve
      - PYTHONPATH=/app/src
    command: ["python", "-c", "from jeve import db; print(db.migrate())"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jeve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeve}
      POSTGRES_DB: jeve
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
    # No host port: Postgres is internal to this stack. `docker compose exec`
    # reaches it when an operator needs to.
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeve -d jeve"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
