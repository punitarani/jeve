# Production deployment configuration
# Local stateful dependencies remain in docker-compose.yml

name: jeve-prod

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - JEVE_DATABASE_URL=postgresql://jeve:jeve@postgres:5432/jeve
      - PYTHONPATH=/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sim:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.sim
    environment:
      - JEVE_DATABASE_URL=postgresql://jeve:jeve@postgres:5432/jeve
      - PYTHONPATH=/app/src
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python -m jeve.sim"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jeve
      POSTGRES_PASSWORD: jeve
      POSTGRES_DB: jeve
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeve -d jeve"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata: