[project]
name = "jeve"
version = "0.1.0"
description = "A continuously-running simulation of a small interconnected economy."
requires-python = ">=3.14"
dependencies = [
    # LLM-0008: spans for every model call. Guarded behind `jeve.tracing`, and
    # not imported at all unless a key is set.
    "braintrust>=0.41",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jeve"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# No test may hang the overnight run.
timeout = 120
addopts = "-q -m 'not live'"
markers = [
    "live: issues a real, billable OpenRouter call (deselected by default)",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test bodies stay readable; boundaries are still typed.
disallow_untyped_decorators = false

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# LLM-0004: every model call goes through jeve.llm. Nothing else talks HTTP.
"httpx".msg = "Only jeve.llm may reach the network (LLM-0004)."
# CORE-0005: randomness is path-derived and time is simulated.
"random".msg = "Use jeve.core.seed.derive_rng (CORE-0005)."
"uuid.uuid4".msg = "Use the seeded id minter (CORE-0005)."
"time.time".msg = "Sim time comes from the world clock (CORE-0003)."
"datetime.datetime.now".msg = "Sim time comes from the world clock (CORE-0003)."
"datetime.datetime.utcnow".msg = "Sim time comes from the world clock (CORE-0003)."

[tool.ruff.lint.per-file-ignores]
# The gateway is the one place allowed to hold a socket and read the wall clock.
"src/jeve/llm/*.py" = ["TID251"]
# CORE-0005: the sanctioned home of randomness. Everywhere else must come
# through derive_rng, which is why the ban exists at all.
"src/jeve/core/seed.py" = ["TID251"]
# SIM-0001: the daemon paces itself against the wall clock, and the writer lock
# waits in real time. Neither value ever reaches simulation state.
"src/jeve/sim/daemon.py" = ["TID251"]
"tests/*.py" = ["TID251"]
"scripts/*.py" = ["TID251"]
