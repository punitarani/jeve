# Cloudflare Workers static assets for the jeve site (WEB-0005).
# `next build` emits `out/`; Wrangler uploads and serves it. There is no
# Worker script — an `assets.binding` without a `main` is invalid — and no
# runtime vars: NEXT_PUBLIC_* values are inlined at build time.
#
# Deploy with: wrangler deploy          (from apps/web)
name = "jeve-web"
compatibility_date = "2026-09-21"

# The custom domain. The API is a separate origin (jeve-api.punitarani.com),
# baked into the bundle via NEXT_PUBLIC_JEVE_API when the site is built.
# Top-level: inside [assets] it parses as assets.routes and is ignored.
routes = [
  { pattern = "jeve.punitarani.com", custom_domain = true }
]

[assets]
directory = "out"

# Workers Logs + traces, persisted and queryable in the Cloudflare
# dashboard. 100% sampling — a static site at this volume costs nothing to
# observe. Request/error/latency metrics are always collected; there is no
# metrics toggle.
#
# Two things the config file cannot say:
# * wrangler does not upload observability for a script-less (assets-only)
#   Worker — the matching script-settings were PATCHed in once via the API
#   (2026-09-21) and wrangler deploys leave them alone; verified after
#   deploy a4f4108d.
# * observability.issues requires the account-level real-time issue
#   detection feature; this account does not have it and the settings API
#   rejects the upload over it, so the key stays out.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
